[project]
name = "flipfactor-pytest"
version = "0.1.0"
description = "pytest side of flipfactor: exact test order, seeding and a JSON outcome report"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["pytest>=7"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["flipfactor_pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 130
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
